name: Connected learning checks
on:
  pull_request:
    paths:
      - 'src/features/learning/**'
      - 'src/features/prayer-details/**'
      - 'src/components/workspace/**'
      - 'src/features/portal/**'
      - 'src/pages/CommunityPortalPage.jsx'
      - 'src/components/admin/PrayerEditor.jsx'
      - 'src/components/sections/prayer-times/**'
      - 'supabase/migrations/*learning*'
      - 'supabase/migrations/*additional_prayer*'
      - 'tests/*learning*'
      - 'tests/*prayer*'
      - 'tests/browser/connected-learning.spec.mjs'
      - '.github/workflows/learning-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learning:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run validate
        env:
          VITE_SUPABASE_URL: https://ci-validation.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_validation_only
          JIC_PUBLIC_PREVIEWS: 'off'
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/browser/connected-learning.spec.mjs --reporter=line
      - run: npx playwright test tests/browser/connected-learning.spec.mjs --browser=webkit --reporter=line
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: connected-learning-browser-evidence
          path: test-results/
          retention-days: 3

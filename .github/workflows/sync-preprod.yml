name: Sync latest JIC preprod

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-preprod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone latest preprod
        run: git clone --depth 1 https://github.com/tippytaptap/jicpreprod.git /tmp/jicpreprod

      - name: Replace target contents with preprod
        run: |
          rsync -a --delete --exclude='.git' /tmp/jicpreprod/ ./

      - name: Commit exact preprod copy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Target already matches preprod.'
            exit 0
          fi
          git commit -m 'Replace website with latest JIC preprod/Vercel build'
          git push origin HEAD:main

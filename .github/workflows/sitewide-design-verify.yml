name: Verify sitewide design
on:
  push:
    branches: [design/sitewide-experience-20261025]
    paths: ['.design-transfer/**', '.github/workflows/sitewide-design-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Restore verified local source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma
          data = ''.join(Path(f'.design-transfer/part{i}').read_text() for i in range(7))
          patch = lzma.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '0abbf3b2f33cc0da729c4ecf07c049889c5cb7d67879ffc28ebcf23fac119dfb'
          Path('/tmp/sitewide.patch').write_bytes(patch)
          PY
          git apply --check /tmp/sitewide.patch
          git apply /tmp/sitewide.patch
          mkdir -p /tmp/sitewide-evidence
      - run: npm ci
      - name: Lint, typecheck, full unit suite and production build
        run: npm run validate 2>&1 | tee /tmp/sitewide-evidence/validate.log
        env:
          VITE_SUPABASE_URL: https://ci-validation.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_validation_only
          JIC_PUBLIC_PREVIEWS: 'off'
      - run: npx playwright install --with-deps chromium
      - name: Public pages and staff permission/draft browser checks
        run: npx playwright test tests/browser/sitewide-experience.spec.mjs --workers=2 2>&1 | tee /tmp/sitewide-evidence/public-browser.log
      - name: Learning panels and parent/teacher browser checks
        if: ${{ !cancelled() && success() }}
        run: npx playwright test --config playwright.forms.config.mjs tests/browser/sitewide-learning.spec.mjs 2>&1 | tee /tmp/sitewide-evidence/learning-browser.log
      - name: Publish tested source to isolated design branch
        run: |
          rm -rf .design-transfer
          rm .github/workflows/design-review-snapshot.yml .github/workflows/sitewide-design-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git add src tests docs playwright.config.mjs playwright.forms.config.mjs
          git diff --cached --check
          git commit -m 'Design coherent public, Madrassah and staff experiences'
          git push origin HEAD:design/sitewide-experience-20261025
          git rev-parse HEAD | tee /tmp/sitewide-evidence/tested-commit.txt
      - name: Save browser screenshots and verification logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sitewide-design-verification
          path: |
            test-results/
            /tmp/sitewide-evidence/
          if-no-files-found: warn
          retention-days: 3

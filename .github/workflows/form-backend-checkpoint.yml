name: Content integration checkpoint
on:
  push:
    branches: [maintenance/content-workflow]
    paths:
      - scripts/maintenance/connect_content.py
      - .github/workflows/form-backend-checkpoint.yml
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/maintenance/content-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: python scripts/maintenance/connect_content.py
      - run: npx prettier --write src/features/content src/context/PublishedPagesContext.jsx src/pages/AdultCoursesPage.jsx src/pages/ContentPage.jsx src/components/admin/PostersEditor.jsx
      - id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src supabase/functions/_shared/access.js tests/browser/admin-reliability.spec.mjs tests/browser/content-workflow.spec.mjs
          git commit -m 'Connect admin forms, linked poster pages and registration routes'
          git push origin HEAD:maintenance/content-workflow
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: form-checkpoint-tests
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

name: Form backend checkpoint
on:
  push:
    branches: [maintenance/content-workflow]
    paths:
      - scripts/maintenance/prepare_forms.py
      - .github/workflows/form-backend-checkpoint.yml
permissions:
  contents: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/maintenance/content-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: current
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dcd17bee10bd5def2ab035a5d543d98cdec98899
          path: existing
          persist-credentials: false
      - run: python current/scripts/maintenance/prepare_forms.py "$GITHUB_WORKSPACE"
      - id: commit
        working-directory: current
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations/20260914040000_website_forms.sql supabase/functions/custom-forms/index.ts supabase/functions/custom-forms/maintenance.mjs tests/custom-forms.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint website-only form backend and database regression tests'
            git push origin HEAD:maintenance/content-workflow
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-checkpoint-tests
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

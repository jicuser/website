name: Arabic and TV interactions

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/features/arabic/**'
      - 'src/features/displays/**'
      - 'src/components/shell/**'
      - 'src/styles/**'
      - 'tests/browser/arabic-visual-controls.spec.mjs'
      - 'tests/browser/arabic-connected-learning.spec.mjs'
      - 'tests/browser/tv-editor-workflow.spec.mjs'
      - 'tests/browser/tv-everyday-scenes.spec.mjs'
      - 'tests/browser/tv-screen-layout.spec.mjs'
      - '.github/workflows/arabic-tv-checks.yml'
  push:
    branches: [main]
    paths:
      - 'src/features/arabic/**'
      - 'src/features/displays/**'
      - 'src/components/shell/**'
      - 'src/styles/**'
      - 'tests/browser/arabic-visual-controls.spec.mjs'
      - 'tests/browser/arabic-connected-learning.spec.mjs'
      - 'tests/browser/tv-editor-workflow.spec.mjs'
      - 'tests/browser/tv-everyday-scenes.spec.mjs'
      - 'tests/browser/tv-screen-layout.spec.mjs'
      - '.github/workflows/arabic-tv-checks.yml'

permissions:
  contents: read

concurrency:
  group: arabic-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interactions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check Arabic controls and TV hall layouts
        run: >-
          npx playwright test
          tests/browser/arabic-visual-controls.spec.mjs
          tests/browser/arabic-connected-learning.spec.mjs
          tests/browser/tv-editor-workflow.spec.mjs
          tests/browser/tv-everyday-scenes.spec.mjs
          tests/browser/tv-screen-layout.spec.mjs
          --reporter=line
      - name: Save focused browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arabic-tv-browser-verification
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

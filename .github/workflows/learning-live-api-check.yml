name: Learning live API boundary
on:
  push:
    branches: [ops/learning-live-2026-11-03]
    paths: [.github/workflows/learning-live-api-check.yml]
permissions: {}
jobs:
  public-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify published reads and protected learning endpoints
        env:
          PUBLIC_SUPABASE_URL: https://pwhtguaevhlnzytneemp.supabase.co
          PUBLIC_SUPABASE_KEY: sb_publishable_kc0sUhvgjzu8Uo_FdqfgaA__Yo_Klmt
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          base = os.environ['PUBLIC_SUPABASE_URL']
          headers = {'apikey': os.environ['PUBLIC_SUPABASE_KEY'], 'Origin': 'https://jicmasjid.org', 'Accept': 'application/json'}
          checks = [
            ('prayer_day_details?select=d_date,sunset,zawwal_start,zawwal_end&limit=1', True),
            ('learning_students?select=id&limit=1', False),
            ('learning_courses?select=id&limit=1', False),
            ('fee_receipts?select=id&limit=1', False),
            ('rpc/get_learning_access', False),
            ('rpc/list_learning_admissions', False),
          ]
          for path, public in checks:
              req = urllib.request.Request(base + '/rest/v1/' + path, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=20) as res:
                      status, data = res.status, json.load(res)
              except urllib.error.HTTPError as exc:
                  status, data = exc.code, json.load(exc)
              if public:
                  assert status == 200 and isinstance(data, list), f'Published times API failed: {status}'
                  print('PASS published additional-times API returns a public list')
              else:
                  assert status in (401, 403) and data.get('code') == '42501', f'Protected API boundary failed for {path.split("?")[0]}: {status}'
                  print('PASS anonymous access denied:', path.split('?')[0])
          print('All six production HTTP checks passed; no authenticated data or writes were used.')
          PY

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="80" height="240" viewBox="0 0 80 240">
  <title>Eight-point rosettes dissolving into small facets</title>
  <defs>
    <path id="star" d="M0,-10.3 2.64,-6.37 7.28,-7.28 6.37,-2.64 10.3,0 6.37,2.64 7.28,7.28 2.64,6.37 0,10.3 -2.64,6.37 -7.28,7.28 -6.37,2.64 -10.3,0 -6.37,-2.64 -7.28,-7.28 -2.64,-6.37Z"/>
    <path id="axis" d="M0,12.25 -4.57,8.29 -6.64,-7.31 0,-14.2 6.64,-7.31 4.57,8.29Z"/>
    <path id="corner" d="M-6.15,6.15 -6.58,0.11 0.31,-8.27 4.27,-4.27 8.27,-0.31 -0.11,6.58Z"/>
    <path id="facet" d="M-4.53,11.15 -3.08,3.91 -0.38,-9.86 2.8,-6.56 5.64,-3.64 -0.44,5Z"/>
    <g id="quarter-0">
      <use xlink:href="#axis" transform="translate(0 -24.45) scale(0.07)"/>
    </g>
    <g id="row-0">
      <use xlink:href="#star" transform="scale(0.11)"/>
      <use xlink:href="#quarter-0" transform="rotate(0)"/>
      <use xlink:href="#quarter-0" transform="rotate(90)"/>
      <use xlink:href="#quarter-0" transform="rotate(180)"/>
      <use xlink:href="#quarter-0" transform="rotate(270)"/>
    </g>
    <g id="quarter-1">
      <use xlink:href="#axis" transform="translate(0 -24.45) scale(0.15)"/>
      <use xlink:href="#corner" transform="translate(14.78 -14.78) scale(0.15)"/>
    </g>
    <g id="row-1">
      <use xlink:href="#star" transform="scale(0.15)"/>
      <use xlink:href="#quarter-1" transform="rotate(0)"/>
      <use xlink:href="#quarter-1" transform="rotate(90)"/>
      <use xlink:href="#quarter-1" transform="rotate(180)"/>
      <use xlink:href="#quarter-1" transform="rotate(270)"/>
    </g>
    <g id="quarter-2">
      <use xlink:href="#axis" transform="translate(0 -24.45) scale(0.3)"/>
      <use xlink:href="#corner" transform="translate(14.78 -14.78) scale(0.3)"/>
      <use xlink:href="#facet" transform="translate(8.4 -20.48) scale(0.3)"/>
      <g transform="rotate(90) scale(-1 1)"><use xlink:href="#facet" transform="translate(8.4 -20.48) scale(0.3)"/></g>
    </g>
    <g id="row-2">
      <use xlink:href="#star" transform="scale(0.3)"/>
      <use xlink:href="#quarter-2" transform="rotate(0)"/>
      <use xlink:href="#quarter-2" transform="rotate(90)"/>
      <use xlink:href="#quarter-2" transform="rotate(180)"/>
      <use xlink:href="#quarter-2" transform="rotate(270)"/>
    </g>
    <g id="quarter-3">
      <use xlink:href="#axis" transform="translate(0 -24.45) scale(0.5)"/>
      <use xlink:href="#corner" transform="translate(14.78 -14.78) scale(0.5)"/>
      <use xlink:href="#facet" transform="translate(8.4 -20.48) scale(0.5)"/>
      <g transform="rotate(90) scale(-1 1)"><use xlink:href="#facet" transform="translate(8.4 -20.48) scale(0.5)"/></g>
    </g>
    <g id="row-3">
      <use xlink:href="#star" transform="scale(0.5)"/>
      <use xlink:href="#quarter-3" transform="rotate(0)"/>
      <use xlink:href="#quarter-3" transform="rotate(90)"/>
      <use xlink:href="#quarter-3" transform="rotate(180)"/>
      <use xlink:href="#quarter-3" transform="rotate(270)"/>
    </g>
    <g id="quarter-4">
      <use xlink:href="#axis" transform="translate(0 -24.45) scale(0.7)"/>
      <use xlink:href="#corner" transform="translate(14.78 -14.78) scale(0.7)"/>
      <use xlink:href="#facet" transform="translate(8.4 -20.48) scale(0.7)"/>
      <g transform="rotate(90) scale(-1 1)"><use xlink:href="#facet" transform="translate(8.4 -20.48) scale(0.7)"/></g>
    </g>
    <g id="row-4">
      <use xlink:href="#star" transform="scale(0.7)"/>
      <use xlink:href="#quarter-4" transform="rotate(0)"/>
      <use xlink:href="#quarter-4" transform="rotate(90)"/>
      <use xlink:href="#quarter-4" transform="rotate(180)"/>
      <use xlink:href="#quarter-4" transform="rotate(270)"/>
    </g>
    <g id="quarter-5">
      <use xlink:href="#axis" transform="translate(0 -24.45) scale(0.88)"/>
      <use xlink:href="#corner" transform="translate(14.78 -14.78) scale(0.88)"/>
      <use xlink:href="#facet" transform="translate(8.4 -20.48) scale(0.88)"/>
      <g transform="rotate(90) scale(-1 1)"><use xlink:href="#facet" transform="translate(8.4 -20.48) scale(0.88)"/></g>
    </g>
    <g id="row-5">
      <use xlink:href="#star" transform="scale(0.88)"/>
      <use xlink:href="#quarter-5" transform="rotate(0)"/>
      <use xlink:href="#quarter-5" transform="rotate(90)"/>
      <use xlink:href="#quarter-5" transform="rotate(180)"/>
      <use xlink:href="#quarter-5" transform="rotate(270)"/>
    </g>
    <g id="quarter-6">
      <use xlink:href="#axis" transform="translate(0 -24.45) scale(1)"/>
      <use xlink:href="#corner" transform="translate(14.78 -14.78) scale(1)"/>
      <use xlink:href="#facet" transform="translate(8.4 -20.48) scale(1)"/>
      <g transform="rotate(90) scale(-1 1)"><use xlink:href="#facet" transform="translate(8.4 -20.48) scale(1)"/></g>
    </g>

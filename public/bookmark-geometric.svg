  <use xlink:href="#row-0" transform="translate(0 0)" opacity="0.3"/>
  <use xlink:href="#row-0" transform="translate(80 0)" opacity="0.3"/>
  <use xlink:href="#row-1" transform="translate(40 40)" opacity="0.45"/>
  <use xlink:href="#row-2" transform="translate(0 80)" opacity="0.64"/>
  <use xlink:href="#row-2" transform="translate(80 80)" opacity="0.64"/>
  <use xlink:href="#row-3" transform="translate(40 120)" opacity="0.8"/>
  <use xlink:href="#row-4" transform="translate(0 160)" opacity="0.92"/>
  <use xlink:href="#row-4" transform="translate(80 160)" opacity="0.92"/>
  <use xlink:href="#row-5" transform="translate(40 200)" opacity="0.98"/>
  <use xlink:href="#row-6" transform="translate(0 240)" opacity="1"/>
  <use xlink:href="#row-6" transform="translate(80 240)" opacity="1"/>

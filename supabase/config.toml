project_id = "jic-website"

[functions.tv-control]
# Public posters, staff JWTs and paired-TV tokens have separate handler checks.
# All staff mutations still require getUser() and an active trusted database role.
verify_jwt = false

[functions.submit-form]
# Public validated submissions with transactional rate limits; no account is needed.
# Publishable API keys are not JWTs and must reach this public handler too.
verify_jwt = false

[functions.manage-user]
# Verify the user's JWT with Auth, then require active database permissions.
# Handler verification also supports projects using asymmetric JWT signing keys.
verify_jwt = false

[functions.push-worker]
# Scheduled server caller only; handler checks its dedicated secret before reading the queue.
verify_jwt = false

[functions.custom-forms]
# Visitors may submit published forms; every private action verifies getUser and current DB access.
verify_jwt = false

[functions.payment-webhook]
# Stripe raw-body signature is mandatory; this endpoint never accepts client confirmations.
verify_jwt = false
